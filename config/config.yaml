faiss_db:
  collection_name: "document_portal"

embedding_model:
  provider: "huggingface"
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  # Alternative models:
  # model_name: "sentence-transformers/all-mpnet-base-v2"  # Higher quality
  # model_name: "BAAI/bge-small-en-v1.5"  # Good balance

retriever:
  top_k: 10

llm:
  groq:
    provider: "groq"
    model_name: "llama-3.3-70b-versatile"
    temperature: 0
    max_output_tokens: 2048
    # Alternative Groq models:
    # model_name: "llama-3.1-70b-versatile"
    # model_name: "mixtral-8x7b-32768"
    # model_name: "gemma2-9b-it"

  huggingface:
    provider: "huggingface"
    model_name: "meta-llama/Llama-3.2-3B-Instruct"
    temperature: 0
    max_output_tokens: 2048
    # Alternative HuggingFace models:
    # model_name: "google/flan-t5-large"  # Good for Q&A
    # model_name: "mistralai/Mistral-7B-Instruct-v0.2"  # High quality
    # model_name: "microsoft/phi-2"  # Fast, smaller model
    # model_name: "HuggingFaceH4/zephyr-7b-beta"  # Good instruction following
